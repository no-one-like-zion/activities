<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grandmasters Profiles</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      background-color: #eeeed2;
      background-image: conic-gradient(#b7c99a 25%, #eeeed2 0 50%, #b7c99a 0 75%, #eeeed2 0);
      background-size: 100px 100px;
    }
    .page-link { color: #302e2b; cursor: pointer; }
    .page-link:hover { background-color: #769656; color: white; }
    #currentpage { background-color: #769656; color: white; }
  </style>
</head>

<body>
  <div class="container-fluid position-fixed top-0 z-1 shadow" style="background-color: #302e2b; border-bottom: 4px solid #769656;">
    <div class="row">
      <div class="col">
        <div class="text-center display-6 text-white py-3">♔ Grandmasters Profiles ♔</div>
      </div>
    </div>
  </div>

  <div class="container mt-5 pt-5">
    <div class="input-group shadow">
      <input type="text" class="form-control" id="search" placeholder="Search a grandmaster's username (e.g. hik)" onkeydown="if(event.key == 'Enter') searchPlayer()">
      <button class="btn text-white" style="background-color: #302e2b;" onclick="searchPlayer()">♞ Search</button>
    </div>
  </div>

  <div class="container mt-3">
    <nav aria-label="Page navigation example">
      <ul class="pagination shadow-sm">
        <li class="page-item"><a class="page-link" onclick="prev()">Previous</a></li>
        <li class="page-item"><a class="page-link" id="currentpage">1</a></li>
        <li class="page-item"><a class="page-link" onclick="next()">Next</a></li>
      </ul>
    </nav>
  </div>

  <div class="container">
    <div class="row" id="parent">

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script>
    // element initializations
    var elCurrentPage = document.getElementById("currentpage");
    var elParent = document.getElementById("parent");
    var elSearch = document.getElementById("search");

    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    var page = urlParams.get('page');
    if(page == null){
      page = 1;
    } else {
      page = parseInt(page);
    }

    //pagination variables
    var allPlayers = [];
    var players = [];
    var lastItem = 0;
    var perPage = 20;
    var finalPage = 1;

    const getPlayers = async () => {
      const response = await fetch('https://api.chess.com/pub/titled/GM');
      const data = await response.json();

      allPlayers = data.players;
      players = allPlayers;
      lastItem = players.length;
      finalPage = Math.ceil(lastItem / perPage);

      getItems();
    }

    const getItems = async () => {
      elParent.innerHTML = '';
      elCurrentPage.innerHTML = page;

      if(lastItem == 0){
        elParent.innerHTML = `<div class="col-12 text-center h5 mt-4"><span class="bg-white rounded-pill px-4 py-2 shadow-sm">No grandmasters found</span></div>`;
        return;
      }

      for(var i = (page - 1) * perPage; i < page * perPage && i < lastItem; i++){

        const response = await fetch('https://api.chess.com/pub/player/' + players[i]);
        const player = await response.json();

        var username = players[i];
        var name = player.name;
        var country = player.country.slice(-2);

        if(name == undefined){
          name = "No name listed";
        }

        elParent.innerHTML += `
          <div class="col-12">
            <div class="card shadow-sm p-3 d-flex flex-row align-items-center my-3" style="border-left: 8px solid #769656 !important;">
              <div class="rounded-pill px-3 text-white" style="background-color: #302e2b;">`+country+`</div>
              <a style="text-decoration: none" class="text-body" href="view.html?username=`+username+`&page=`+page+`">
                <div class="h4 mx-4 my-0">♘ `+name+`</div>
              </a>
              <div class="text-secondary">@`+username+`</div>
            </div>
          </div>
        `;
      }
    }

    //search function
    function searchPlayer(){
      var text = elSearch.value.trim().toLowerCase();

      players = allPlayers.filter(p => p.startsWith(text));

      lastItem = players.length;
      finalPage = Math.ceil(lastItem / perPage) || 1;
      page = 1;
      getItems();
    }

    //pagination functions
    function prev(){
      page -= 1;
      if(page == 0){
        page = finalPage;
      }
      getItems();
    }

    function next(){
      page += 1;
      if(page > finalPage){
        page = 1;
      }
      getItems();
    }

    getPlayers();
  </script>
</body>

</html>
