<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grandmasters Profiles</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
</head>

<body style="background-color: #eeeed2; font-family: 'Fredoka', sans-serif;">
  <div class="container-fluid bg-dark position-fixed top-0 z-1 shadow">
    <div class="row">
      <div class="col">
        <div class="text-center display-6 text-white py-3">Grandmasters Profiles</div>
      </div>
    </div>
  </div>

  <div class="container mt-5 pt-5">
    <div class="row">
      <div class="col">
        <a href="index.html" id="backlink">
          <div class="btn btn-outline-secondary">Back to list</div>
        </a>
      </div>
    </div>
  </div> 

  <div class="container mt-3 mb-5">
    <div class="row">
      <div class="col-12 col-lg-8 mx-auto">
        <div class="card shadow rounded-5 overflow-hidden text-center">

          <div style="height: 110px; background-color: #769656;"></div>

          <div id="imageContainer" class="mx-auto rounded-circle bg-white border border-4 border-white shadow overflow-hidden" style="width: 140px; height: 140px; margin-top: -70px;">
            <img src="" style="width: 100%;" id="image">
          </div>

          <div class="p-4">
            <div class="h2 mt-2" id="name">
              <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>

            <div class="text-secondary mb-3" id="username"></div>

            <div class="mb-4">
              <span class="rounded-pill px-4 py-1 bg-warning" id="title"></span>
              <span class="rounded-pill px-4 py-1 bg-dark text-white" id="country"></span>
            </div>

            <div class="row" id="details"></div>

            <hr class="my-4">
            <div class="h5 mb-3">Ratings</div>

            <div class="row" id="stats"></div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script>
    function box(label, value, note) {
      return `<div class="col-6 col-md-3 mb-3"><div class="rounded-4 p-3 h-100" style="background-color: #eeeed2;"><div class="text-secondary small">` + label + `</div><div class="h5 my-1">` + value + `</div><div class="text-secondary small">` + note + `</div></div></div>`;
    }

    function boxMode(label, mode) {
      if (!mode) return box(label, "-", "Not played");
      return box(label, mode.last.rating, "W " + mode.record.win + " / L " + mode.record.loss + " / D " + mode.record.draw);
    }

    var elName = document.getElementById("name");
    var elImage = document.getElementById("image");
    var elUsername = document.getElementById("username");
    var elTitle = document.getElementById("title");
    var elCountry = document.getElementById("country");
    var elDetails = document.getElementById("details");
    var elStats = document.getElementById("stats");
    var elBacklink = document.getElementById("backlink");
  
    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    const username = urlParams.get('username');
    const page = urlParams.get('page');

    if(page != null) {
      elBacklink.href = "index.html?page=" + page;
    }

    const getPlayer = async () => {
      elName.innerHTML = "Loading " + username;
      elImage.src = "";
      elTitle.innerHTML = "";
      elCountry.innerHTML = "";

      const response = await fetch('https://api.chess.com/pub/player/' + username);
      const player = await response.json();

      if(player.username == undefined){
        elName.innerHTML = "Player not found";
        return;
      }

      elName.innerHTML = player.name || player.username;
      elImage.src = player.avatar || "";
      elUsername.innerHTML = "@" + player.username;
      elTitle.innerHTML = player.title || "Untitled";
      elCountry.innerHTML = player.country.slice(-2);

      elDetails.innerHTML = box("Followers", player.followers, "") +
        box("Location", player.location || "Not listed", "") +
        box("Joined", new Date(player.joined * 1000).toLocaleDateString(), "") +
        box("Last online", new Date(player.last_online * 1000).toLocaleDateString(), "");

      const response2 = await fetch('https://api.chess.com/pub/player/' + username + '/stats');
      const stats = await response2.json();

      elStats.innerHTML = boxMode("Rapid", stats.chess_rapid) +
        boxMode("Blitz", stats.chess_blitz) +
        boxMode("Bullet", stats.chess_bullet) +
        boxMode("Daily", stats.chess_daily) +
        box("FIDE", stats.fide || "-", "");
    }

    if(username != null){
      getPlayer();
    }
  </script>
</body>

</html>
