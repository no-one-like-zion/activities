<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess Profiles</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="container-fluid bg-danger position-fixed top-0 z-1 shadow">
    <div class="row">
      <div class="col">
        <div class="text-center display-6 text-white py-3">Chess Profiles</div>
      </div>
    </div>
  </div>

  <div class="container mt-5 pt-5">
    <nav aria-label="Page navigation example">
      <ul class="pagination">
        <li class="page-item"><a class="page-link" onclick="prev()">Previous</a></li>
        <li class="page-item"><a class="page-link" id="currentpage">1</a></li>
        <li class="page-item"><a class="page-link" onclick="next()">Next</a></li>
      </ul>
    </nav>
  </div>

  <div class="container">
    <div class="row" id="parent">

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script>
    function capitalizeFirstLetter(str) {
      if (!str) return str;
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    // element initializatioon
    var elCurrentPage = document.getElementById("currentpage");
    var elParent = document.getElementById("parent");

    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    var page = urlParams.get('page');
    if(page == null){
      page = 1;
    } else {
      page = parseInt(page);
    }

    //pagination variables
    var lastItem = 0; // TODO: get last item from mein API
    var perPage = 20;
    var finalPage = Math.ceil(lastItem / perPage);

    const getItems = async () => {
      elParent.innerHTML = '';
      elCurrentPage.innerHTML = page;
      for(var i = ((page - 1) * perPage) + 1; i <= page * perPage; i++){

        const response = await fetch('API_URL' + i); // TODO: API url
        const item = await response.json();

        var id = item.id;     // TODO
        var name = item.name; // TODO

        elParent.innerHTML += `
          <div class="col-12">
            <div class="card shadow-sm p-3 d-flex flex-row align-items-center my-3">
              <a style="text-decoration: none" class="text-body" href="view.html?id=`+id+`&page=`+page+`">
                <div class="h4 mx-4 my-0">`+capitalizeFirstLetter(name)+`</div>
              </a>
            </div>
          </div>
        `;
      }
    }

    //pagination functions
    function prev(){
      page -= 1;
      if(page == 0){
        page = finalPage;
      }
      getItems();
    }

    function next(){
      page += 1;
      if(page > finalPage){
        page = 1;
      }
      getItems();
    }

    getItems();
  </script>
</body>

</html>
