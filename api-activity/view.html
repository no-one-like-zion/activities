<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess Profiles View</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="container-fluid bg-danger position-fixed top-0 z-1 shadow">
    <div class="row">
      <div class="col">
        <div class="text-center display-6 text-white py-3">Chess Profiles View</div>
      </div>
    </div>
  </div>

  <div class="container mt-5 pt-5">
    <div class="row">
      <div class="col">
        <a href="index.html" id="backlink">
          <div class="btn btn-outline-secondary">Back to list</div>
        </a>
      </div>
    </div>
  </div>

  <div class="container mt-3">
    <div class="row">
      <div class="col">
        <div class="card shadow rounded-5 p-5 text-center">

          <div id="imageContainer" class="mx-auto rounded-circle" style="width: 300px; height: 300px;">
            <img src="" style="width: 100%;" id="image">
          </div>

          <div class="h3 my-3" id="name">
            <div class="spinner-border" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>

          <div>
            <span class="rounded-5 px-4 py-1" id="extra"></span>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script>
    function capitalizeFirstLetter(str) {
      if (!str) return str;
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    var elName = document.getElementById("name");
    var elImage = document.getElementById("image");
    var elExtra = document.getElementById("extra");
    var elImageContainer = document.getElementById("imageContainer");
    var elBacklink = document.getElementById("backlink");

    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    const id = urlParams.get('id');
    const page = urlParams.get('page');

    if(page != null) {
      elBacklink.href = "index.html?page=" + page;
    }

    const getItem = async () => {
      elName.innerHTML = "Loading " + id;
      elImage.src = "";
      elExtra.innerHTML = "";

      const response = await fetch('API_URL' + id);
      const item = await response.json();

      elName.innerHTML = capitalizeFirstLetter(item.name);
      elImage.src = item.image;                            
      elExtra.innerHTML = item.extra;                      
    }

    if(id != null){
      getItem();
    }
  </script>
</body>

</html>
