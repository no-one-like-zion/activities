<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bento Layout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #d9d9d9; }
 
    .board {
      background: #fff;
      padding: 1.5rem;
      margin-top: 2rem;
      margin-bottom: 2rem;
    }
 
    .tile {
      background: #ffd9d9;
      color: #fff;
      font-weight: 700;
      font-size: 1.5rem;
      min-height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
 
    .tile.title { background: #d9bbbb; font-size: 2.5rem; }
    .tile.banner { background: #d9d9d9; }
  </style>
</head>
<body>
 
  <div class="container board">
 
    <div class="row g-3 mb-3">
      <div class="col-12 col-md-4">
        <div class="tile h-100">IMAGE 1</div>
      </div>
      <div class="col-12 col-md-3">
        <div class="tile h-100">IMAGE 1</div>
      </div>
      <div class="col-12 col-md-5">
        <div class="d-flex flex-column gap-3 h-100">
          <div class="tile flex-fill" style="min-height: 64px;">Text Placeholder</div>
          <div class="tile flex-fill" style="min-height: 64px;">About</div>
        </div>
      </div>
    </div>
 
    <div class="row g-3 mb-3">
      <div class="col-6 col-md-2">
        <div class="tile h-100">IMAGE 1</div>
      </div>
      <div class="col-6 col-md-2">
        <div class="tile h-100">IMAGE 1</div>
      </div>
      <div class="col-12 col-md-5">
        <div class="tile title h-100">TITLE</div>
      </div>
      <div class="col-12 col-md-3">
        <div class="tile h-100">IMAGE 1</div>
      </div>
    </div>
 
    <div class="row g-3">
      <div class="col-12">
        <div class="tile banner"></div>
      </div>
    </div>
 
  </div>
 
</body>
</html>
