<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bento Layout</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="media/css/style.css" rel="stylesheet">
</head>
<body>

  <div class="container board">

    <!-- ROW 1: big image | image | two text boxes -->
    <div class="row g-3 mb-3">

      <div class="col-12 col-md-4">
        <!-- Image tile: two stacked images, the second one appears on hover -->
        <div class="tile hover-swap round-tl position-relative overflow-hidden h-100">
          <img src="media/images/placeholder.svg" class="img-base position-absolute top-0 start-0 w-100 h-100 object-fit-cover" alt="Placeholder image 1">
          <img src="media/images/placeholder-hover.svg" class="img-hover position-absolute top-0 start-0 w-100 h-100 object-fit-cover" alt="">
        </div>
      </div>

      <div class="col-12 col-md-3">
        <div class="tile hover-swap position-relative overflow-hidden h-100">
          <img src="media/images/placeholder.svg" class="img-base position-absolute top-0 start-0 w-100 h-100 object-fit-cover" alt="Placeholder image 2">
          <img src="media/images/placeholder-hover.svg" class="img-hover position-absolute top-0 start-0 w-100 h-100 object-fit-cover" alt="">
        </div>
      </div>

      <div class="col-12 col-md-5">
        <div class="d-flex flex-column gap-3 h-100">
          <div class="tile flex-fill" style="min-height: 64px;">Text Placeholder</div>
          <div class="tile round-br flex-fill" style="min-height: 64px;">About</div>
        </div>
      </div>

    </div>

    <!-- ROW 2: two small images | title | image -->
    <div class="row g-3 mb-3">
      <div class="col-6 col-md-2">
        <div class="tile hover-swap position-relative overflow-hidden h-100">
          <img src="media/images/placeholder.svg" class="img-base position-absolute top-0 start-0 w-100 h-100 object-fit-cover" alt="Placeholder image 3">
          <img src="media/images/placeholder-hover.svg" class="img-hover position-absolute top-0 start-0 w-100 h-100 object-fit-cover" alt="">
        </div>
      </div>

      <div class="col-6 col-md-2">
        <div class="tile hover-swap position-relative overflow-hidden h-100">
          <img src="media/images/placeholder.svg" class="img-base position-absolute top-0 start-0 w-100 h-100 object-fit-cover" alt="Placeholder image 4">
          <img src="media/images/placeholder-hover.svg" class="img-hover position-absolute top-0 start-0 w-100 h-100 object-fit-cover" alt="">
        </div>
      </div>

      <div class="col-12 col-md-5">
        <div class="tile title round-diag h-100">TITLE</div>
      </div>

      <div class="col-12 col-md-3">
        <div class="tile hover-swap round-br position-relative overflow-hidden h-100">
          <img src="media/images/placeholder.svg" class="img-base position-absolute top-0 start-0 w-100 h-100 object-fit-cover" alt="Placeholder image 5">
          <img src="media/images/placeholder-hover.svg" class="img-hover position-absolute top-0 start-0 w-100 h-100 object-fit-cover" alt="">
        </div>
      </div>

    </div>
    <!-- ROW 3: banner (chopsticks and wasabi image goes here later nyehehe) -->
    <div class="row g-3">
      <div class="col-12">
        <div class="tile banner"></div>
      </div>
    </div>

  </div>

</body>
</html>
