<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Json</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: #f5f1e8;
      color: #1b2a41;
    }

    .card {
      background-color: #ffffff;
      border: 2px solid #c9a227 !important;
    }

    .region-img {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="row" id="json">

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script>
    /*
        source for the regions' logos
      - Riot Games, Regions of Runeterra:
        https://support.riotgames.com/legends-of-runeterra/gameplay/regions-of-runeterra
    */
    var regions = [
      {
        name: "Shurima",
        description: "A fallen desert empire of sun-scorched ruins and ascended rulers.",
        image: "shurima"
      },
      {
        name: "Piltover",
        description: "A wealthy city of progress, invention, and hextech.",
        image: "piltover"
      },
      {
        name: "Zaun",
        description: "A smoky undercity below Piltover, rich in chemtech and grit.",
        image: "zaun"
      },
      {
        name: "Freljord",
        description: "A frozen northern land of warring tribes and fierce survivors.",
        image: "freljord"
      },
      {
        name: "Bilgewater",
        description: "A lawless port city of pirates, monster hunters, and fortune seekers.",
        image: "bilgewater"
      },
      {
        name: "Ionia",
        description: "A spiritual island land where nature and magic stay in balance.",
        image: "ionia"
      },
      {
        name: "Demacia",
        description: "A proud kingdom built on justice, honor, and duty.",
        image: "demacia"
      },
      {
        name: "Noxus",
        description: "A ruthless empire where strength decides who rises.",
        image: "noxus"
      },
      {
        name: "Targon",
        description: "A towering sacred mountain where celestial powers dwell.",
        image: "targon"
      },
      {
        name: "Shadow Isles",
        description: "A cursed island shrouded in the deadly Black Mist.",
        image: "shadow"
      },
      {
        name: "Bandle City",
        description: "A whimsical home of the magical, mischievous yordles.",
        image: "bandle"
      },
    ]


    var el_json = document.getElementById("json");

    for (var i = 0; i < regions.length; i++) {
      el_json.innerHTML += `
        <div class="col-12 col-md-6 col-lg-4">
          <div class="card p-5 my-3 shadow rounded-4 text-center">
            <img class="region-img mx-auto mb-3" src="images/` + regions[i].image + `.png" alt= "` + regions[i].name + ` logo">
            <div class="h2 fw-semibold">
              ` + regions[i].name + `
            </div>
            <div class="mt-3">
              ` + regions[i].description + `
            </div>
          </div>
        </div>
      `;
    }
  </script>
</body>

</html>
